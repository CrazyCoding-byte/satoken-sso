spring.application.name=sa-auth
server.port=8081
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/satoken?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 三个服务必须连同一个 Redis，token 才能互相识别
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
# 三处配置必须完全一致
sa-token.token-name=satoken
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=uuid
sa-token.is-log=true