spring.application.name=sa-model
server.port=8083

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/satokenstudy?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true

# 三个服务都一样
sa-token.token-name=satoken
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=uuid
sa-token.is-log=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
